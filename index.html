<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aurelia — premium clothing for men, women and kids. A React front-end project." />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <title>Aurelia — Premium Shopping, Redefined</title>
    <script>
      /* Apply the saved theme before React loads so there is no light/dark flash. */
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('aurelia_theme') || 'light');
      } catch (e) { /* storage unavailable: keep the default light theme */ }
    </script>
  </head>
  <body>
    <noscript>Aurelia needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
